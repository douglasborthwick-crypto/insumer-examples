[profile.default]
src = "."
test = "."
out = "out"
libs = ["lib"]
no_match_path = "{test-harness,rfc-contributions}/**"
solc_version = "0.8.28"

# evm_version = "osaka" enables the RIP-7212 P256VERIFY precompile in
# Foundry's local REVM, which the predicate's _verifyP256 function calls
# at address 0x0100. Required for InsumerAccessPredicate.t.sol's
# happy-path test to exercise real ECDSA P-256 verification.
#
# Real chain deployments (Base, Optimism, Arbitrum, Polygon, Scroll,
# ZKsync, Celo, etc.) provide the precompile at 0x0100 regardless of
# their nominal EVM version; this setting only governs the local test
# environment.
evm_version = "osaka"

optimizer = true
optimizer_runs = 200

# Setup:
#   forge install foundry-rs/forge-std --no-commit
#   forge test
